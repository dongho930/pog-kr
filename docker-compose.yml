version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pog
      POSTGRES_PASSWORD: pog_password
      POSTGRES_DB: pogdb
    ports:
      - "5432:5432"
    volumes:
      - pog_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  pog_pgdata:
